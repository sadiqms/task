trigger: none   # Trigger manually or via webhook after CI is done

variables:
  containerRepoECR: 'ghcr.io/sadiqms/flask-app-ecr'
  containerRepoACR: 'ghcr.io/sadiqms/flask-app-acr'
  chartRepo: 'ghcr.io/sadiqms/flask-app'   # Helm chart OCI repo in GHCR
  k8sNamespace: 'default'
  releaseName: 'flask-app'
  githubRepo: 'sadiqms/task'   # repo where CI publishes releases

stages:
# --- Staging Deployment ---
- stage: Staging
  displayName: "Deploy to Staging"
  jobs:
  - deployment: StagingDeployment
    displayName: "Staging deployment"
    environment: "staging"  ## Auto Deploy -- No approval needed
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
            - bash: |
                echo "Fetching latest release info from GitHub API..."
                curl -s https://api.github.com/repos/$(githubRepo)/releases/latest > latest.json

                TAG_URL=$(jq -r '.assets[] | select(.name=="tag.txt") | .browser_download_url' latest.json)
                if [ -z "$TAG_URL" ]; then
                  echo "No tag.txt asset found in latest release!"
                  exit 1
                fi

                echo "Downloading tag.txt from $TAG_URL"
                curl -L "$TAG_URL" -o tag.txt

                TAG=$(cat tag.txt)

                echo "Logging in to GHCR for Helm..."
                export HELM_EXPERIMENTAL_OCI=1
                echo "$(GHCR_PAT)" | helm registry login ghcr.io -u sadiqms --password-stdin

                echo "Pulling Helm chart version $TAG from GHCR..."
                helm pull oci://$(chartRepo) --version $TAG

                echo "Deploying to staging with Helm using image tag $TAG"
                helm upgrade --install $(releaseName) flask-app-$TAG.tgz \
                  --namespace $(k8sNamespace) \
                  --set image.repository=$(containerRepoECR) \
                  --set image.tag=$TAG
              displayName: "Helm upgrade to staging"

# --- Production Deployment ---
- stage: Production
  displayName: "Deploy to Production"
  dependsOn: Staging
  jobs:
  - deployment: ProdDeployment
    displayName: "Production deployment"
    environment: "production"  # Manual approval + health gate configured in Environments UI
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
            - bash: |
                echo "Fetching latest release info from GitHub API..."
                curl -s https://api.github.com/repos/$(githubRepo)/releases/latest > latest.json

                TAG_URL=$(jq -r '.assets[] | select(.name=="tag.txt") | .browser_download_url' latest.json)
                if [ -z "$TAG_URL" ]; then
                  echo "No tag.txt asset found in latest release!"
                  exit 1
                fi

                echo "Downloading tag.txt from $TAG_URL"
                curl -L "$TAG_URL" -o tag.txt

                TAG=$(cat tag.txt)

                echo "Logging in to GHCR for Helm..."
                export HELM_EXPERIMENTAL_OCI=1
                echo "$(GHCR_PAT)" | helm registry login ghcr.io -u sadiqms --password-stdin

                echo "Pulling Helm chart version $TAG from GHCR..."
                helm pull oci://$(chartRepo) --version $TAG

                echo "Deploying to production with Helm using image tag $TAG"
                helm upgrade --install $(releaseName) flask-app-$TAG.tgz \
                  --namespace $(k8sNamespace) \
                  --set image.repository=$(containerRepoACR) \
                  --set image.tag=$TAG
              displayName: "Helm upgrade to production"

            # Save last known-good tag for rollback
            - bash: |
                TAG=$(cat tag.txt)
                echo "Saving $TAG as last known-good tag"
                echo "$TAG" > good_tag.txt
              displayName: "Save last known-good tag"

            - task: PublishPipelineArtifact@1
              inputs:
                targetPath: good_tag.txt
                artifact: good-tag
                publishLocation: pipeline

# --- Rollback Stage ---
- stage: Rollback
  displayName: "Rollback on failed health gate"
  dependsOn:
    - Staging
    - Production
  condition: |
    or(
      failed('Staging'),
      failed('Production')
    )
  jobs:
  - job: Revert
    displayName: "Rollback to last known-good"
    steps:
      - checkout: self
      - task: DownloadPipelineArtifact@2
        inputs:
          artifact: good-tag
          path: $(Pipeline.Workspace)
      - bash: |
          echo "Rolling back with Helm to last known-good tag..."
          GOOD_TAG=$(cat $(Pipeline.Workspace)/good_tag.txt)

          export HELM_EXPERIMENTAL_OCI=1
          echo "$(GHCR_PAT)" | helm registry login ghcr.io -u sadiqms --password-stdin
          helm pull oci://$(chartRepo) --version $GOOD_TAG

          helm upgrade --install $(releaseName) flask-app-$GOOD_TAG.tgz \
            --namespace $(k8sNamespace) \
            --set image.repository=$(containerRepoECR) \
            --set image.tag=$GOOD_TAG
        displayName: "Helm rollback"