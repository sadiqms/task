name: CI_Build_Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit count
        id: commit_count
        run: echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          cd flask-app
          docker build -t flask-app .

      - name: Tag images for GHCR ECR alias
        run: |
          TAG="${{ github.run_number }}-${{ github.sha }}"
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-ecr:$TAG
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-ecr:latest

      - name: Tag images for GHCR ACR alias
        run: |
          TAG="${{ github.run_number }}-${{ github.sha }}"
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-acr:$TAG
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-acr:latest

      - name: Push to GHCR ECR alias
        run: |
          TAG="${{ github.run_number }}-${{ github.sha }}"
          docker push ghcr.io/${{ github.actor }}/flask-app-ecr:$TAG
          docker push ghcr.io/${{ github.actor }}/flask-app-ecr:latest

      - name: Push to GHCR ACR alias
        run: |
          TAG="${{ github.run_number }}-${{ github.sha }}"
          docker push ghcr.io/${{ github.actor }}/flask-app-acr:$TAG
          docker push ghcr.io/${{ github.actor }}/flask-app-acr:latest

      - name: Save the tag
        run: |
          TAG="${{ github.run_number }}-${{ github.sha }}"
          echo "$TAG" > tag.txt

      - name: Upload tag.txt to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: tag.txt
          tag_name: image-tag-${{ github.run_number }}-${{ github.sha }}
          name: "Image Tag ${{ github.run_number }}-${{ github.sha }}"
          body: "Tag for deployment"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/flask-app-ecr:${{ github.run_number }}-${{ github.sha }}
