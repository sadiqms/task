name: CI Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Get commit count
        id: commit_count
        run: echo "count=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          cd flask-app
          docker build -t flask-app .

      - name: Tag for GHCR ECR alias
        run: |
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-ecr:${{ steps.commit_count.outputs.count }}
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-ecr:latest

      - name: Tag for GHCR ACR alias
        run: |
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-acr:${{ steps.commit_count.outputs.count }}
          docker tag flask-app ghcr.io/${{ github.actor }}/flask-app-acr:latest

      - name: Push to GHCR ECR alias
        run: |
          docker push ghcr.io/${{ github.actor }}/flask-app-ecr:${{ steps.commit_count.outputs.count }}
          docker push ghcr.io/${{ github.actor }}/flask-app-ecr:latest

      - name: Push to GHCR ACR alias
        run: |
          docker push ghcr.io/${{ github.actor }}/flask-app-acr:${{ steps.commit_count.outputs.count }}
          docker push ghcr.io/${{ github.actor }}/flask-app-acr:latest

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.actor }}/flask-app-ecr:${{ steps.commit_count.outputs.count }}
